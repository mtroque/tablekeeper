name: Factory

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue number to build'
        required: false
        type: string
      dry_run:
        description: 'List the queue and skip reasons without building'
        required: false
        type: boolean
        default: false

concurrency:
  group: factory-runner
  cancel-in-progress: false

jobs:
  factory:
    name: Factory Runner
    if: vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tablekeeper
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Reset database
        run: pnpm db:reset
      - name: Run factory builder
        id: run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FACTORY_PROJECT_TOKEN: ${{ secrets.FACTORY_PROJECT_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_SESSION_KEY: ${{ secrets.FACTORY_SESSION_KEY }}
          FACTORY_ISSUE_NUMBER: ${{ inputs.issue_number }}
          FACTORY_DRY_RUN: ${{ inputs.dry_run }}
          LLM_PROVIDER: fake
        run: pnpm exec tsx scripts/factory/run.ts
      - name: Upload encrypted session artifact
        if: always() && steps.run.outputs.session_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: session-${{ steps.run.outputs.session_id }}
          path: ${{ steps.run.outputs.session_file }}
          retention-days: 30
