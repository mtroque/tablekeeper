name: Smoke

# Read-only checks against production after each deploy (W26, docs/DEPLOYMENT.md → Smoke test
# after each deploy). Vercel reports this repo's deploys as commit statuses ("Vercel – tablekeeper",
# "Vercel – tablekeeper-api"), not GitHub Deployments, so the trigger is `status` on a commit at the
# tip of `main` (production), not `deployment_status`. A failure opens (or comments on) one
# `needs-human` issue. No secrets: only the public URLs. Each deploy reports one status per
# project, so the smoke waits until neither is pending and may run twice for one commit.
on:
  status:
  workflow_dispatch:
    inputs:
      api_url:
        description: API URL (default the production API)
        required: false
      web_url:
        description: Web URL (default the production web app)
        required: false

permissions:
  contents: read
  issues: write
  statuses: read

jobs:
  smoke:
    name: Smoke
    # Only "Vercel – <project>" deploy statuses, not "Vercel Preview Comments".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.state == 'success' &&
       startsWith(github.event.context, 'Vercel – ') &&
       contains(github.event.branches.*.name, 'main'))
    # On the job, so status events that skip the job never queue behind (or replace) a real run.
    concurrency:
      group: smoke-${{ github.event.sha || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_URL: ${{ inputs.api_url || vars.SMOKE_API_URL || 'https://tablekeeper-api.vercel.app' }}
      WEB_URL: ${{ inputs.web_url || vars.SMOKE_WEB_URL || 'https://tablekeeper-beryl.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for the other Vercel deploy
        if: github.event_name == 'status'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.sha }}
        run: |
          for _ in $(seq 30); do
            done_count=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.statuses[] | select((.context == "Vercel – tablekeeper" or .context == "Vercel – tablekeeper-api") and .state != "pending")] | length')
            [ "$done_count" -ge 2 ] && exit 0
            echo "$done_count/2 Vercel deploy(s) settled for $SHA; waiting."
            sleep 30
          done
          # Smoke anyway (the deploy that already finished still needs checking), but say so in any
          # issue; the slow deploy's own status starts another run when it finishes.
          echo "Still waiting on Vercel deploys after 15 minutes; smoking what is live now."
          echo "STILL_PENDING=1" >> "$GITHUB_ENV"
      - name: Smoke
        id: smoke
        run: |
          set -o pipefail
          pnpm -s smoke --api "$API_URL" --web "$WEB_URL" | tee smoke.txt
      - name: Open a needs-human issue
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name == 'status' && format('{0} on {1}', github.event.context, github.event.sha) || format('manual run by {0}', github.actor) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Production smoke failed'
          {
            echo "The post-deploy smoke failed ($TRIGGER)."
            echo
            if [ -n "${STILL_PENDING:-}" ]; then
              echo "Note: not all Vercel deploys of this commit had settled after 15 minutes, so this may be a half-deployed state. The pending deploy reruns the smoke when it finishes; check that run before acting."
              echo
            fi
            echo '```'
            cat smoke.txt
            echo '```'
            echo
            echo "Run: $RUN_URL"
            echo
            echo 'Fix forward or roll back (docs/DEPLOYMENT.md → Rollback), then close this issue.'
          } > body.md
          # The factory creates this label; create it here too so a missing label can't swallow the alert.
          gh label create needs-human --color d93f0b --description 'Blocked or stopped; needs human attention' 2>/dev/null || true
          existing=$(gh issue list --state open --label needs-human --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label needs-human --body-file body.md
          fi
